<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Hybrid Film</title>
<style>
  html, body { margin: 0; background: #0b0d12; color: #cfd6e4; font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  canvas { display: block; max-width: 100vw; max-height: calc(100vh - 56px); margin: 0 auto; background: #000; }
  #bar { display: none; gap: 10px; align-items: center; padding: 10px 14px; }
  body.preview #bar { display: flex; }
  #bar input[type=range] { flex: 1; }
  button { background: #1f2a44; color: #fff; border: 0; border-radius: 4px; padding: 6px 12px; cursor: pointer; }
  #status { min-width: 220px; text-align: right; opacity: .8; }
</style>
<script type="importmap">
{ "imports": {
  "three": "/vendor/three/build/three.module.js",
  "three/addons/": "/vendor/three/examples/jsm/",
  "mp4-muxer": "/vendor/mp4-muxer/build/mp4-muxer.mjs"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="bar">
  <button id="play">Play</button>
  <input id="scrub" type="range" min="0" max="1" value="0">
  <label><input id="hq" type="checkbox"> film quality</label>
  <span id="status"></span>
</div>
<script type="module">
import { createFilm } from '/renderer.js';
import { createEncoder } from '/encoder.js';
import { inspectModel } from '/inspect.js';

const params = new URLSearchParams(location.search);
const canvas = document.getElementById('c');
let film = null, spec = null, encoder = null;

async function init() {
  spec = await (await fetch('/spec.json')).json();
  film = await createFilm(canvas, spec, { onLog: (lvl, msg) => console.log(`[${lvl}] ${msg}`) });
  return { ...film.info, start: spec.start, end: spec.end, fps: spec.fps };
}

window.hfilm = {
  init,
  inspect: (url) => inspectModel(url),
  async render(frame, samples) { return film.renderFrame(frame, samples); },
  async startVideo(opts) { encoder = await createEncoder(canvas, { ...opts, width: spec.width, height: spec.height, fps: spec.fps }); return true; },
  async encode(index) { await encoder.add(index); return encoder.queue(); },
  async finishVideo() { const bytes = await encoder.finish(); return bytes; },
  sample(points) {  // debug/tests: sRGB pixels of the last rendered frame at [[x,y],...] (top-left origin)
    const c = document.createElement('canvas'); c.width = canvas.width; c.height = canvas.height;
    const g = c.getContext('2d'); g.drawImage(canvas, 0, 0);
    return points.map(([x, y]) => Array.from(g.getImageData(x, y, 1, 1).data.slice(0, 3)));
  },
  async snapshot(frame, quality = 0.92) {
    const blob = await new Promise((r) => canvas.toBlob(r, 'image/jpeg', quality));
    const res = await fetch(`/frame/${frame}`, { method: 'POST', body: blob });
    if (!res.ok) throw new Error(`Frame write failed: HTTP ${res.status}`);
    return true;
  },
};

if (params.get('mode') === 'preview') {
  document.body.classList.add('preview');
  const info = await init();
  const scrub = document.getElementById('scrub'), status = document.getElementById('status'), hq = document.getElementById('hq');
  scrub.min = info.start; scrub.max = info.end - 1; scrub.value = info.start;
  let playing = false, busy = false, t0 = 0, f0 = info.start;
  const show = async (f) => {
    if (busy) return; busy = true;
    const r = await film.renderFrame(f, hq.checked ? spec.render.samples : 1);
    status.textContent = `frame ${f} / ${info.end - 1}  ·  ${r.ms} ms  ·  ${info.gpu.replace(/^ANGLE \(|\)$/g, '')}`;
    busy = false;
  };
  scrub.oninput = () => { playing = false; document.getElementById('play').textContent = 'Play'; show(+scrub.value); };
  hq.onchange = () => show(+scrub.value);
  document.getElementById('play').onclick = (e) => {
    playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play';
    t0 = performance.now(); f0 = +scrub.value;
  };
  const loop = async () => {
    if (playing && !busy) {
      let f = f0 + Math.floor((performance.now() - t0) / 1000 * info.fps);
      if (f >= info.end) { f0 = info.start; t0 = performance.now(); f = info.start; }
      scrub.value = f; await show(f);
    }
    requestAnimationFrame(loop);
  };
  show(info.start); loop();
}
</script>
</body>
</html>
